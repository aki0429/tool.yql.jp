<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全国電力需給ダッシュボード</title>
    <link rel="icon" href="data:,">
    <script src="script.js" defer></script>
    <style>
        :root {
            --bg: #eef3f1;
            --panel: #fbfcf7;
            --panel-strong: #ffffff;
            --text: #173229;
            --muted: #5a6f67;
            --line: #c7d4ce;
            --accent: #0c7c59;
            --accent-soft: #d8efe3;
            --warn: #d97706;
            --danger: #c2410c;
            --shadow: 0 18px 50px rgba(22, 45, 38, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(12, 124, 89, 0.12), transparent 30%),
                linear-gradient(180deg, #f7fbf8 0%, var(--bg) 100%);
        }

        button,
        select {
            font: inherit;
        }

        .shell {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
        }

        .hero {
            padding: 36px 0 24px;
        }

        .hero-inner {
            padding: 28px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            background:
                linear-gradient(135deg, rgba(12, 124, 89, 0.96), rgba(19, 50, 41, 0.96)),
                linear-gradient(180deg, #0c7c59, #173229);
            box-shadow: var(--shadow);
            color: #f7fbf8;
        }

        .eyebrow {
            margin: 0 0 12px;
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(247, 251, 248, 0.72);
        }

        h1 {
            margin: 0;
            font-size: clamp(30px, 6vw, 52px);
            line-height: 1.05;
        }

        .hero-copy {
            margin: 14px 0 0;
            max-width: 820px;
            font-size: 15px;
            line-height: 1.7;
            color: rgba(247, 251, 248, 0.84);
        }

        .hero-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .hero-chip {
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
            font-size: 13px;
        }

        .section {
            padding: 18px 0 26px;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
            margin-bottom: 16px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 22px;
        }

        .section-title p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .overview {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .overview-item {
            padding: 16px;
            border: 1px solid var(--line);
            background: var(--panel-strong);
            box-shadow: var(--shadow);
        }

        .overview-label {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .overview-value {
            margin-top: 8px;
            font-size: 28px;
            font-weight: 700;
        }

        .overview-note {
            margin-top: 6px;
            font-size: 13px;
            color: var(--muted);
        }

        .company-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .company-card {
            position: relative;
            padding: 16px;
            border: 1px solid var(--line);
            background: var(--panel-strong);
            box-shadow: var(--shadow);
            cursor: pointer;
            text-align: left;
            transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
        }

        .company-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .company-card.is-selected {
            border-color: var(--accent);
            background: linear-gradient(180deg, #ffffff 0%, var(--accent-soft) 100%);
        }

        .company-name {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
        }

        .company-area {
            margin-top: 2px;
            font-size: 13px;
            color: var(--muted);
        }

        .company-demand {
            margin-top: 14px;
            font-size: 30px;
            font-weight: 700;
            line-height: 1;
        }

        .company-demand small {
            font-size: 13px;
            color: var(--muted);
            font-weight: 600;
        }

        .company-meta {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .company-meta dt {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .company-meta dd {
            margin: 4px 0 0;
            font-size: 15px;
            font-weight: 700;
        }

        .status-pill {
            position: absolute;
            top: 14px;
            right: 14px;
            padding: 5px 8px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            background: var(--accent);
        }

        .status-pill.warn {
            background: var(--warn);
        }

        .status-pill.danger {
            background: var(--danger);
        }

        .details {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr);
            gap: 16px;
        }

        .panel {
            border: 1px solid var(--line);
            background: var(--panel-strong);
            box-shadow: var(--shadow);
        }

        .panel-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            padding: 18px 18px 0;
        }

        .panel-head h3 {
            margin: 0;
            font-size: 24px;
        }

        .panel-sub {
            margin-top: 6px;
            font-size: 13px;
            color: var(--muted);
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            padding: 16px 18px 0;
        }

        .metric {
            padding: 14px;
            background: var(--panel);
            border: 1px solid var(--line);
        }

        .metric-label {
            font-size: 12px;
            color: var(--muted);
        }

        .metric-value {
            margin-top: 8px;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.1;
        }

        .metric-value small {
            font-size: 13px;
            color: var(--muted);
            font-weight: 600;
        }

        .chart-wrap {
            padding: 18px;
        }

        .chart {
            width: 100%;
            height: 260px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, rgba(12, 124, 89, 0.05), transparent 70%),
                #fdfefb;
        }

        .table-wrap {
            padding: 0 18px 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            font-size: 13px;
        }

        th {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .raw-wrap {
            padding: 0 18px 18px;
        }

        details {
            border: 1px solid var(--line);
            background: var(--panel);
        }

        summary {
            cursor: pointer;
            padding: 12px 14px;
            font-weight: 700;
        }

        pre {
            margin: 0;
            padding: 14px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            border-top: 1px solid var(--line);
            font-size: 12px;
            line-height: 1.55;
            background: #fcfdfa;
        }

        .empty {
            padding: 18px;
            color: var(--muted);
        }

        .spark-note {
            padding: 0 18px 18px;
            font-size: 13px;
            color: var(--muted);
        }

        @media (max-width: 980px) {
            .overview,
            .metric-grid,
            .details {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 720px) {
            .shell {
                width: min(100% - 20px, 1180px);
            }

            .hero-inner {
                padding: 22px;
            }

            .overview,
            .metric-grid,
            .details {
                grid-template-columns: 1fr;
            }

            .section-title {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="hero">
            <div class="hero-inner">
                <p class="eyebrow">Japan Power Watch</p>
                <h1>全国電力需給ダッシュボード</h1>
                <p class="hero-copy">
                    北海道から沖縄まで、各一般送配電事業者の公開CSVをまとめて見られる画面です。
                    今の需要、予備率、ピーク見通し、時間帯ごとの推移を同じ視点で追えるようにしています。
                </p>
                <div class="hero-meta" id="hero-meta"></div>
            </div>
        </header>

        <main>
            <section class="section">
                <div class="section-title">
                    <div>
                        <h2>全国サマリー</h2>
                        <p>読み込み済みの会社だけで、現在需要とひっ迫度を俯瞰します。</p>
                    </div>
                </div>
                <div class="overview" id="overview"></div>
            </section>

            <section class="section">
                <div class="section-title">
                    <div>
                        <h2>会社別一覧</h2>
                        <p>カードを押すと下の詳細が切り替わります。</p>
                    </div>
                </div>
                <div class="company-grid" id="company-grid"></div>
            </section>

            <section class="section">
                <div class="section-title">
                    <div>
                        <h2>詳細</h2>
                        <p>選択した電力会社のCSVを要約して表示します。</p>
                    </div>
                </div>
                <div class="details" id="details"></div>
            </section>
        </main>
    </div>
</body>
</html>
