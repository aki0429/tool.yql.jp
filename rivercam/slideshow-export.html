<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>スライドショー保存｜河川カメラ</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0a1017;color:#eaf2f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.7}.wrap{width:min(900px,calc(100% - 30px));margin:45px auto}.panel{margin:18px 0;padding:22px;background:#101a24;border:1px solid #354555;border-radius:8px}h1{margin:0 0 5px}.sub{color:#9fb5c6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid label{display:flex;flex-direction:column;gap:5px;color:#9fb5c6;font-size:13px}.grid input,.grid select{padding:10px;border:1px solid #41576b;border-radius:5px;background:#0a1017;color:#fff}.periods{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}.periods button,.actions button{padding:9px 14px;border:1px solid #41576b;border-radius:999px;background:#111c27;color:#fff;cursor:pointer}.periods button.active,.periods button:hover{background:#176b91;border-color:#65d5ff}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:18px}.actions button{border-radius:5px;background:#176b91}.actions button:disabled{opacity:.5;cursor:wait}#cameras{margin:0;padding-left:1.3em;columns:2}#status{color:#9fb5c6}@media(max-width:650px){.grid{grid-template-columns:1fr}#cameras{columns:1}}
  </style>
</head>
<body><main class="wrap">
  <h1>スライドショーを保存</h1>
  <p class="sub">マップで保存したカメラの過去画像を、指定条件でカメラごとにエンコードしてZIPへまとめます。</p>
  <section class="panel"><h2>対象カメラ</h2><ul id="cameras"><li>確認中…</li></ul></section>
  <section class="panel">
    <h2>書き出し設定</h2>
    <div class="periods"><button data-hours="1">過去1時間</button><button data-hours="3">過去3時間</button><button data-hours="6" class="active">過去6時間</button><button data-hours="12">過去12時間</button><button data-hours="24">過去24時間</button></div>
    <div class="grid">
      <label>開始日時<input id="start" type="datetime-local" step="300"></label>
      <label>終了日時<input id="end" type="datetime-local" step="300"></label>
      <label>取得間隔<select id="interval"><option value="5">5分ごと</option><option value="10" selected>10分ごと</option><option value="30">30分ごと</option><option value="60">1時間ごと</option></select></label>
      <label>再生速度<select id="fps"><option value="1">1枚/秒</option><option value="2">2枚/秒</option><option value="3">3枚/秒</option><option value="4">4枚/秒</option><option value="5" selected>5枚/秒</option><option value="6">6枚/秒</option><option value="7">7枚/秒</option><option value="8">8枚/秒</option><option value="9">9枚/秒</option><option value="10">10枚/秒</option></select></label>
      <label>形式<select id="format"><option value="mp4">MP4</option><option value="gif">GIF</option></select></label>
    </div>
    <div class="actions"><button id="save" disabled>エンコードしてZIP保存</button><span id="status"></span></div>
  </section>
</main>
<script>
const EXPORT_SERVER='http://100.121.87.80:8787',ids=(new URLSearchParams(location.search).get('cams')||'').split(',').filter(id=>/^\d{6,15}$/.test(id));
const $=id=>document.getElementById(id);let valid=[];
function localValue(date){return new Date(date-date.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function setPeriod(hours,button){const end=new Date();end.setMinutes(Math.floor(end.getMinutes()/5)*5,0,0);$('end').value=localValue(end);$('start').value=localValue(new Date(end-hours*3600000));document.querySelectorAll('.periods button').forEach(item=>item.classList.toggle('active',item===button))}
async function init(){setPeriod(6,document.querySelector('[data-hours="6"]'));document.querySelectorAll('.periods button').forEach(button=>button.onclick=()=>setPeriod(+button.dataset.hours,button));try{const cameras=await fetch(`${EXPORT_SERVER}/api/cameras`).then(r=>r.json()),map=new Map(cameras.map(camera=>[camera.id,camera]));valid=ids.map(id=>map.get(id)).filter(Boolean);$('cameras').innerHTML=valid.length?valid.map(camera=>`<li>${camera.prefecture} ${camera.municipality} / ${camera.name}（${camera.id}）</li>`).join(''):'有効なカメラがありません';$('save').disabled=!valid.length;$('status').textContent=`${valid.length}台を保存します`}catch(error){$('status').textContent=`接続エラー: ${error.message}`}}
$('save').onclick=async()=>{const button=$('save');button.disabled=true;$('status').textContent='過去画像を取得・エンコードしています…';try{const response=await fetch(`${EXPORT_SERVER}/api/cameras/zip`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({cameraIds:valid.map(camera=>camera.id),start:$('start').value,end:$('end').value,intervalMinutes:+$('interval').value,fps:+$('fps').value,format:$('format').value})});if(!response.ok)throw Error(await response.text());const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`rivercam-slideshow-${Date.now()}.zip`;link.click();setTimeout(()=>URL.revokeObjectURL(url),60000);$('status').textContent='保存が完了しました'}catch(error){$('status').textContent=`失敗: ${error.message}`}finally{button.disabled=false}};
init();
</script></body></html>
