<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>YQL 地震・津波・EEW情報システム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="quake-container">
        <div id="display-area">
            <div id="title" class="hidden">YQL 地震情報</div>
            <div id="main-text" class="hidden"></div>
            <canvas id="map-canvas" class="hidden"></canvas>
            <div id="intensity-display" class="hidden"></div>
        </div>
        
        <!-- EEW警報専用レイアウト -->
        <div id="eew-layout" class="hidden">
            <div class="eew-header">緊急地震速報（気象庁）</div>
            <div class="eew-content">
                <div class="eew-map-container">
                    <canvas id="eew-map-canvas"></canvas>
                </div>
                <div class="eew-areas-container">
                    <div id="eew-areas-list"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="status-log">Loading data...</div>
    <script src="quake.js"></script>
</body>
</html>
