<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スライドショー保存</title><link rel="stylesheet" href="style.css"></head><body><header><p>RIVERCAM / SLIDESHOW EXPORT</p><h1>スライドショーを保存</h1><div id="status">カメラを確認中</div></header><main><section class="history-export"><h2>対象カメラ</h2><div id="cameras">確認中…</div></section><section class="history-export"><h2>書き出し設定</h2><div class="period-picker"><span>表示期間</span><button data-hours="1">過去1時間</button><button data-hours="3">過去3時間</button><button data-hours="6" class="active">過去6時間</button><button data-hours="12">過去12時間</button><button data-hours="24">過去24時間</button></div><div class="history-grid"><label>開始日時<input id="start" type="datetime-local" step="300"></label><label>終了日時<input id="end" type="datetime-local" step="300"></label><label>取得間隔<select id="interval"><option value="5">5分ごと</option><option value="10" selected>10分ごと</option><option value="30">30分ごと</option><option value="60">1時間ごと</option></select></label><label>再生速度<select id="fps"><option value="1">1枚/秒</option><option value="2">2枚/秒</option><option value="3">3枚/秒</option><option value="4">4枚/秒</option><option value="5" selected>5枚/秒</option><option value="6">6枚/秒</option><option value="7">7枚/秒</option><option value="8">8枚/秒</option><option value="9">9枚/秒</option><option value="10">10枚/秒</option></select></label><label>形式<select id="format"><option value="mp4">MP4</option><option value="gif">GIF</option></select></label></div><div class="history-actions"><button id="save" disabled>エンコードしてZIP保存</button><span id="result"></span></div></section></main><script src="slideshow-export.js"></script></body></html>
