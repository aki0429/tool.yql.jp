<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="地上デジタル放送の受信エリアのめやすを検索できます。">
  <title>A-PAB 放送エリアのめやす</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=20260713-2">
</head>
<body>
  <header>
    <h1>A-PAB 放送エリアのめやす</h1>
    <nav>
      <a href="https://tv-area.jp/#/map/" target="_blank" rel="noreferrer">公式サイト</a>
      <a href="https://www.apab.or.jp/" target="_blank" rel="noreferrer">A-PAB</a>
    </nav>
  </header>

  <main class="map-content">
    <aside>
      <div class="searchbox">
        <div class="input-wp">
          <input id="station-search-input" type="search" placeholder="中継局名を入力">
          <button id="station-search-button" type="button">検索</button>
        </div>
        <p id="status" class="status">地図をダブルクリックすると、その地点の対象局を最大10件選択します。</p>
        <button id="reset-button" class="reset" type="button">リセット</button>
      </div>

      <div class="menu-stationlist pcview">
        <h2>選択中の中継局</h2>
        <div id="selected-count" class="selected-count">0 / 10</div>
        <div id="selected-list"></div>
      </div>
    </aside>

    <section class="map-panel">
      <div id="map"></div>
      <div id="search-results" class="search-results" hidden></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js?v=20260713-2"></script>
</body>
</html>
